name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      # TODO: Add deployment steps for each service
      # - Web: Deploy to Vercel / AWS Amplify
      # - API: Deploy to Railway / AWS ECS
      # - AI Engine: Deploy to Railway / AWS Lambda
      # - Worker: Deploy to Railway / AWS ECS
